[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-organic-lab-dashboard-api"
version = "0.1.0"
description = "Dashboard FastAPI server for the AC Organic Self-driving Lab. Thin presentation layer over lab-skills."
requires-python = ">=3.10"
dependencies = [
    "lab-skills",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "mcp>=1.0",
    # Official Opentrons labware definitions (schema-2 JSON) — read-only
    # "standard" source for the labware store/builder.
    "opentrons-shared-data>=8.0",
]

[project.scripts]
lab-history-mcp = "app.mcp_server:run"
lab-control-mcp = "app.assistant_control:run"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.uv.sources]
lab-skills = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

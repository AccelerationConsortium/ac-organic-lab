sections:
  # - id: lab_environment
  #   title: Lab Environment
  #   description: "Temperature, humidity, O₂, and VOC"
  #   kind: environmental_map
  #   equipment: [env_hte, env_storage, env_lab499_west, env_lab499_east]

  # Overview order (operator decision 2026-09-06, Ligand Development added
  # 2026-09-10): Services → HTE → Complexation → Gibbie →
  # Process Chemistry → Ligand Development. The headline "Accounts & Activities" tile
  # is pinned to the left column top and Services to the right column top;
  # remaining sections alternate columns. Nav tabs follow the same order
  # but list only sections with an `href`, so Services (which has none)
  # does not appear there.
  - id: web_services
    title: Services
    kind: platform
    # hostops_* stay registered + polled in equipment.yaml but render on
    # /utils/devices (the PCs & Servers panel), not on this card.
    equipment: [ac_organic_lab_api, ac_organic_lab_auth, laagente_analitica, analytica_db, bitacora_eln, pypoe_web, kasa_tapo_gateway, bambu_gateway, gibbie_server, lle_server, uptime_kuma, hermes_web]

  - id: hte
    title: HTE Platform
    description: High-throughput platform for chemistry
    href: /platforms/hte
    kind: platform
    # The Platforms tab opens here on a first visit (at most one section may
    # set this). Overview order is unaffected — that is still section order.
    default: true
    equipment:
      - cam_hte_tapo_c245
      - xarm_translocation
      - fume_hood_actuator
      - ot2_hte
      - dose_every_well
      - torry_pines_shaker
      - filter_every_well
      - plateloc
      - cytation_5
      - agilent_uplc_ms
      - agilent_biostack
      # Power strips last — pinned to the bottom of the HTE grid.
      - plug_hte_strip_right
      - plug_hte_strip_left

  - id: complexation
    title: Complexation Platform
    description: Electrochemistry platform
    href: /platforms/complexation
    kind: platform
    equipment:
      - cam_echem_tapo_c100
      - ot2_complexation
      - lumastir

  - id: sample_prep
    title: Gibbie Platform
    description: Multi-phase Reaction Platform based on Opentrons Flex
    href: /platforms/sample_prep
    kind: platform
    equipment:
      - cam_gibbie_tapo_c100
      - gibbie_workflow
      - gibbie_flex
      - gibbie_ur_arm
      - gibbie_balance
      - gibbie_hotplate

  - id: process_chemistry
    title: Process Chemistry Platform
    description: Reaction, workup and analysis bench driven by automated-lle
    href: /platforms/process_chemistry
    kind: platform
    # Monitoring only (2026-09-06): the tiles come from a read-only gateway on
    # the bench PC, and the bench is driven by automated-lle and ChemStation.
    equipment:
      # First camera supplies the Overview card's live feed.
      - cam_echem_tapo_c245
      - lle_ur5_arm
      - lle_easymax
      - lle_hplc
      - lle_xpr_balance
      - lle_ph_unit

  - id: ligand_development
    title: Ligand Development Platform
    description: Ligand-development bench; MG400 first, more equipment later
    href: /platforms/ligand_development
    kind: platform
    equipment:
      # First camera supplies the Overview card's live feed.
      - cam_ligand_tapo_d246
      - dobot_mg400

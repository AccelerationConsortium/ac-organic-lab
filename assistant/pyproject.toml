[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-assistant"
version = "0.1.0"
description = "The lab's chat-assistant engine: model backends (Claude CLI, OpenAI-compatible, Hermes), the agent loop and SSE streaming, saved Plan-mode sessions. Mounted by the dashboard API; tools come from MCP servers passed in, never imported."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "mcp>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-skills"
version = "0.1.0"
description = "SDK and aggregator for the AC Organic Self-driving Lab. Provides equipment registry, async polling aggregator, per-device adapters, and the workflow-facing session API."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Shared STATUS_SPEC contract types (spec major.minor == package version).
    # Pinned to a tag; bump the tag when the spec revs.
    "sdl-lab-contract",
]

[project.optional-dependencies]
# The control-capable MCP server (lab_skills.mcp / `lab-skills mcp serve`).
# Optional so importing the SDK, or running the aggregator, needs no MCP deps.
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mcp>=1.0",
]

[project.scripts]
lab-skills = "lab_skills.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
sdl-lab-contract = { git = "https://github.com/AccelerationConsortium/sdl-lab-contract", tag = "v1.2.0" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Canonical, client-neutral registry of MCP servers approved for this repo.
# Agent-specific installation files remain local; never put credentials here.
version: 1

servers:
  lab-history:
    description: >-
      First-party read-only observability server (api/app/mcp_server.py in
      this repo): live equipment snapshot via the aggregator, plus history-DB
      queries (state events, service uptime, sensor readings, dosing runs,
      per-well results) and journald tails restricted to a whitelist of
      dashboard units. Row counts and lookback are capped server-side.
    transport: stdio
    # Console script `lab-history-mcp` from the api/ package. Clients resolve
    # it through the deployment's own venv (e.g. <repo>/.venv/bin/lab-history-mcp)
    # in their local config — machine paths stay out of this file. Prefer the
    # venv script directly over `uv run`, which self-syncs on launch.
    command: lab-history-mcp
    optional: true

    provenance:
      repository: https://github.com/AccelerationConsortium/ac-organic-lab
      license: MIT
      reviewed_version: api 0.1.0
      reviewed_commit: aa00a4ddfe761729a48ef0aba90bcd6faba0d75b
      reviewed_at: 2026-08-10

    tools:
      # The server's full surface; listed explicitly so client configs can
      # mirror this allowlist and a future tool addition is a reviewed change
      # here, not a silent capability grant.
      include:
        - list_equipment_now
        - get_equipment_status
        - query_equipment_events
        - query_service_uptime
        - query_sensor_readings
        - query_runs
        - query_well_results
        - tail_journald

    sampling:
      enabled: false

    data_policy:
      confidential_data: prohibited
      authoritative_inventory_source: false
      authoritative_safety_source: false
      notes:
        - >-
          Read-only over operational lab telemetry (data/lab.db + the live
          aggregator). No control surface: this server must never grow a tool
          that reaches a device /control/* endpoint — control belongs to the
          lab-skills MCP server (skills/src/lab_skills/mcp.py), which is a
          deliberately separate server with a different trust level (see
          ARCHITECTURE.md decision #10).
        - >-
          Project-scoped scientific results live in BitacoraDB, not here;
          answers from this server are telemetry, not experimental records.
      known_clients:
        - dashboard assistant bubble (api/app/assistant.py, via claude CLI)
        - Hermes `lab-ops` profile on the central server (full allowlist)
        - Hermes `lab-runner` profile under the boxed `hermes` OS user —
          tail_journald EXCLUDED (journal access needs group membership the
          boxed principal deliberately lacks, and unit logs can quote
          secrets); lab.db reached via LabDatabase's read-only fallback
        - Hermes `lab-ops` profile on the central server (allowlist mirrors
          tools.include above)

  lab-skills:
    description: >-
      First-party SDK MCP server (skills/src/lab_skills/mcp.py, launched via
      `lab-skills mcp serve`): the skill catalog as tools — equipment list,
      runtime skills, live STATUS_SPEC status, offline plan validation, and
      live per-step preflight. The actuating execute_plan tool exists but is
      registered only when the process is started with --allow-control.
    transport: stdio
    # Console script `lab-skills` from the skills/ package, args `mcp serve`.
    # Clients resolve it through the deployment's venv (see lab-history note).
    command: lab-skills
    optional: true

    provenance:
      repository: https://github.com/AccelerationConsortium/ac-organic-lab
      license: MIT
      reviewed_version: lab-skills v0.4
      reviewed_commit: aa00a4ddfe761729a48ef0aba90bcd6faba0d75b
      reviewed_at: 2026-08-10

    tools:
      # Approved surface for agent clients: read + preflight only.
      include:
        - list_equipment
        - list_skills
        - get_status
        - validate_plan
        - preflight_plan
      exclude:
        - execute_plan

    sampling:
      enabled: false

    data_policy:
      confidential_data: prohibited
      authoritative_inventory_source: true
      authoritative_safety_source: false
      notes:
        - >-
          Agent clients MUST launch this server WITHOUT --allow-control, so
          execute_plan is never registered (the exclude above is belt and
          braces, not the gate). Enabling --allow-control for an agent is a
          human decision that requires an approval-gated execution design
          (AGENTIC_LAB_DESIGN.md §1.3: only validated, human-approved plans execute)
          — e.g. the authorized-run executor in api/app/workflow.py.
        - >-
          preflight_plan reads live device state but issues no control
          commands; validate_plan is fully offline.
      known_clients:
        - Hermes `lab-ops` profile on the central server (read + preflight
          allowlist, no --allow-control)
        - Hermes `lab-runner` profile under the boxed `hermes` OS user (same
          read + preflight allowlist, no --allow-control; owner string
          hermes:lab-runner)

  lab-runs:
    description: >-
      First-party authorized-run trigger (api/app/run_trigger.py in this
      repo): start, watch (bounded SSE window with a seq cursor), and
      cooperatively abort runs of plans a HUMAN already authorized in
      bitácora, over the dashboard's workflow-executor routes
      (api/app/workflow.py). A thin HTTP client — the executor is the
      authority and re-verifies executability, package digest, and
      revocation (including between steps); refusals are relayed verbatim.
    transport: stdio
    # Console script `lab-runs-mcp` from the api/ package; resolve through
    # the deployment's venv (see the lab-history note). Requires LAB_ACTOR in
    # the environment (never a tool argument) and reaches the dashboard API
    # at DASHBOARD_API_BASE (default loopback :8001).
    command: lab-runs-mcp
    optional: true

    provenance:
      repository: https://github.com/AccelerationConsortium/ac-organic-lab
      license: MIT
      reviewed_version: api 0.1.0
      reviewed_commit: 29283c2eef6dd7c5834c8faa97b558ad03c81ad0
      reviewed_at: 2026-08-12

    tools:
      include:
        - start_run
        - get_run
        - watch_run
        - abort_run

    sampling:
      enabled: false

    data_policy:
      confidential_data: prohibited
      authoritative_inventory_source: false
      authoritative_safety_source: false
      notes:
        - >-
          The agent pulls a trigger a human already loaded, nothing more:
          this server MUST NOT grow a tool that composes, edits, lists, or
          approves plans/authorizations (AGENTIC_LAB_DESIGN.md trust tiers). The
          authorization_id reaches the agent from a human (e.g. a Slack
          message), not from a discovery tool here — that absence is part of
          the design, not a gap.
        - >-
          Attribution rides LAB_ACTOR -> X-Auth-User, trusted by network
          position at the dashboard API. Deployment target is therefore the
          boxed `hermes` OS principal (HERMES_ACCESS_DESIGN Phase 0) with
          LAB_ACTOR pinned to its roster identity (Phase 1); do not wire
          this server into a profile running as sdl2.
        - >-
          start_run(dry_run=true) is the live preflight (no claims, no
          actuation); abort is cooperative at step boundaries. Every start,
          refusal, and abort lands in the plan_run audit trail under the
          bound actor.
      known_clients:
        - Hermes `lab-runner` profile under the boxed `hermes` OS user
          (LAB_ACTOR=hermes@lab.local; full 4-tool allowlist)

  lab-inventory:
    description: >-
      First-party read-only chemical-stock server (api/app/inventory_mcp.py
      in this repo): search chemicals by name/CAS/synonym, sufficiency
      checks ("is 50 mL of THF on the shelf"), full per-CAS records
      (hazards, SDS, vendor/lot/expiry per bottle), and per-group totals.
      A thin HTTP front over bitácora's /inventory API (the LIMS Phase 1
      store) — it never opens the store's SQLite file directly.
    transport: stdio
    # Console script `lab-inventory-mcp` from the api/ package; resolve
    # through the deployment's venv (see the lab-history note). Reaches
    # bitácora at BITACORA_URL (default loopback :8050) — the same env var
    # the workflow executor uses.
    command: lab-inventory-mcp
    optional: true

    provenance:
      repository: https://github.com/AccelerationConsortium/ac-organic-lab
      license: MIT
      reviewed_version: api 0.1.0
      reviewed_commit: e2cc321243f05c9b6339e49639707dce2ed613aa
      reviewed_at: 2026-08-15

    tools:
      # The durable agent-facing contract: these names are question-shaped
      # (not storage-shaped) so the planned backend swap to BitacoraDB's
      # Substance/Lot/Container ledger (DATABASE_DESIGN.md §5) changes
      # nothing client-side.
      include:
        - search_inventory
        - check_stock
        - get_chemical
        - inventory_stats

    sampling:
      enabled: false

    data_policy:
      confidential_data: prohibited
      authoritative_inventory_source: false
      authoritative_safety_source: false
      notes:
        - >-
          Read surface only; bitácora's store is authoritative. This server
          MUST stay read-only: inventory writes (import, tombstone, future
          auto-deduction) are admin actions gated on edge-verified identity
          at bitácora and must never appear here as tools.
        - >-
          Hazard fields (GHS/H/P codes, SDS links) are convenience copies
          enriched from PubChem — not an authoritative safety source; the
          SDS itself is.
        - >-
          The authoritative_inventory_source flag above refers to the
          EQUIPMENT inventory (equipment.yaml, owned by lab-skills), not
          chemical stock — hence false here despite the name.
      known_clients:
        - dashboard assistant bubble (api/app/assistant.py, both Ask and
          Control modes; allowlist mirrors tools.include above)

  lab-hostops:
    description: >-
      Whitelisted host-operations server (one instance per lab machine):
      service status/log-tail/restart for services named in that host's
      config whitelist, serial-port enumeration, and loopback STATUS_SPEC
      /status probes. No shell tool and no path to device /control/* by
      design. Transport is stdio (spawned locally or over SSH) or
      bearer-token streamable-http for the Windows device PCs.
    transport: stdio
    command: lab-hostops-serve
    optional: true

    provenance:
      repository: https://github.com/AccelerationConsortium/sdl-lab-hostops
      license: MIT
      reviewed_version: 0.1.0
      reviewed_commit: 9d096ec59231a0cd4c6488ae216d7b5ad802e6dc
      reviewed_at: 2026-08-11

    tools:
      include:
        - host_info
        - service_status
        - tail_service_log
        - restart_service
        - list_serial_ports
        - probe_local_status

    sampling:
      enabled: false

    data_policy:
      confidential_data: prohibited
      authoritative_inventory_source: false
      authoritative_safety_source: false
      notes:
        - >-
          restart_service is the only mutating tool; it is double-gated (the
          per-host `restartable` config subset, plus the client allowlist)
          and audits to POST /api/ingest/events as `hostops_action`.
          Read-only instances set `restartable = []`.
        - >-
          Per-host whitelists are machine-local config, not part of this
          registry; this entry approves the tool surface, each host decides
          its targets.
      known_clients:
        - Hermes `lab-ops` profile → `hostops-gaia` instance on the central
          server (read-only; restart_service excluded from its allowlist)

  pubchem:
    description: >-
      Read-only PubChem discovery for compound identity, properties,
      cross-references, bioactivity, assays, and entity summaries.
    transport: streamable-http
    url: https://pubchem.caseyjhand.com/mcp
    optional: true

    provenance:
      repository: https://github.com/cyanheads/pubchem-mcp-server
      license: Apache-2.0
      reviewed_version: 0.4.1
      reviewed_commit: 309ce0479867825dbd73a41265e7dde12503f0a8
      reviewed_at: 2026-07-22

    tools:
      include:
        - pubchem_search_compounds
        - pubchem_get_compound_details
        - pubchem_get_compound_xrefs
        - pubchem_get_bioactivity
        - pubchem_search_assays
        - pubchem_get_summary
      exclude:
        - pubchem_get_compound_safety

    sampling:
      enabled: false

    data_policy:
      confidential_data: prohibited
      authoritative_inventory_source: false
      authoritative_safety_source: false
      notes:
        - >-
          Use for research and database discovery only; do not submit
          proprietary structures, unpublished targets, or secret project data.
        - >-
          PubChem depositor data is not the SDS for the actual supplier,
          formulation, concentration, or inventory lot.
        - >-
          The excluded safety tool merges classifications from multiple
          depositors and must not guide handling, PPE, storage, disposal, or
          protocol approval.

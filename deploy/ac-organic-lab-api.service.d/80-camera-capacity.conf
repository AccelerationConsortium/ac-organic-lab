# 80-camera-capacity.conf — camera viewing admission limits (api/app/camera_streams.py).
# Added 2026-10-06: the defaults admit ONE distinct camera feed lab-wide, so any
# open HTE view made every other camera (e.g. the Ligand Development camera)
# fail with "Camera capacity is in use". The lab has 7 camera devices / 12
# lenses and several concurrent users. These are admission reservations, not
# measured QoS (docs/CAMERA_VIEWING.md): 1.5 Mbps per source + 1.5 Mbps per
# viewer, so the worst case (8 sources + 12 viewers) reserves 30 Mbps.
[Service]
Environment=CAMERA_MAX_SOURCES=8
Environment=CAMERA_MAX_VIEWERS=12
Environment=CAMERA_MAX_VIEWERS_PER_USER=6
Environment=CAMERA_NETWORK_BUDGET_MBPS=32

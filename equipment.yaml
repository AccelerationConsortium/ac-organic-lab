# Equipment registry for the AC Organic Self-driving Lab dashboard.
#
# This file is committed. Tailscale hostnames are NOT treated as secrets - they
# require tailnet membership to be reachable. Real secrets (control tokens,
# webhook URLs, etc.) live in `.env`, gitignored.
#
# Adapter values:
#   http        -> equipment conforms to docs/STATUS_SPEC.md
#   legacy_http -> pre-migration shape; aggregator translates per-device
#   mock        -> placeholder; emits an `unknown`-status envelope
#
# Replace the `tail-XXXX` segments below with your actual Tailscale magicDNS
# names or tailnet-IPv4 addresses before deploying.

equipment:
  # ---------------------------------------------------------------------
  # HTE platform - displayed in this order on the overview / HTE pages.
  # The list above drives both the order of the Equipment tiles inside
  # the HTE platform card and the order on the HTE detail page.
  #
  # Tile sizing (`tile: { w, h }`):
  #   - The platform card lays its equipment out on a 4-column CSS grid
  #     with fixed-height rows. `w` is how many columns a tile spans
  #     (1..4) and `h` is how many rows it spans (1..4).
  #   - Default is 2x1 (half-row, single-row tall). Omit `tile:` to use it.
  #   - Set `w: 4` for a full-row banner; `w: 2, h: 2` for a square hero.
  # ---------------------------------------------------------------------

  # The HTE camera is the platform's hero tile: full-row width
  # (`w: 4`) and 4 rows tall (~880 px), enough for the 16:9 live feed
  # plus the PTZ pad / preset controls below it. Hosted by
  # `kasa-tapo-services` (see the trailing "Cameras and smart plugs"
  # comment block below).
  - id: cam_hte_tapo_c245
    name: HTE Camera
    platform: hte
    kind: camera
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8002
    status_path: /cameras/cam_hte_tapo_c245/status
    # Cameras need a longer poll budget than the 2s default - the gateway
    # talks to the camera over ONVIF (SOAP) on every status poll, which
    # can take 1-2 s on its own.
    poll_timeout_seconds: 5.0
    tile: { w: 2, h: 3 }
    camera:
      host: 192.168.8.200
      onvif_port: 2020
      rtsp_port: 554
      lenses:
        # Per TP-Link's RTSP/ONVIF FAQ: dual-lens C245D exposes wide on
        # /stream1 and tele on /stream6 (non-adjacent paths). /stream2 is
        # the SD copy of the wide lens, NOT the tele lens.
        - { id: wide, label: Wide, rtsp_path: stream1 }
        - { id: tele, label: Tele, rtsp_path: stream6 }

  - id: xarm_translocation
    name: UFactory xArm5
    platform: hte
    kind: robot_arm
    adapter: http
    protocol: "1.0"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8000
    status_path: /status
    poll_timeout_seconds: 2.0
    # The repo conforms to STATUS_SPEC v1.0 (read-only). It does not yet
    # expose `/control/*` or claim/heartbeat/release. The SDK keeps the
    # device read-only by leaving `do_not_call_connect: true` in place;
    # specific unit operations will graduate to /control/* in follow-up.
    do_not_call_connect: true
    tile: { w: 2, h: 2 }

  - id: agilent_uplc_ms
    name: Agilent UPLC-MS
    platform: hte
    kind: hplc
    adapter: http
    protocol: "1.0"
    base_url: http://sdl2-pc-06-uplc.tail6a1dd7.ts.net:8010
    status_path: /status
    poll_timeout_seconds: 5.0
    do_not_call_connect: true
    tile: { w: 2, h: 2 }

  - id: ot2
    name: Opentrons OT-2
    platform: hte
    kind: liquid_handler
    adapter: http
    protocol: "1.1"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8020
    status_path: /status
    poll_timeout_seconds: 2.0
    do_not_call_connect: true
    tile: { w: 2, h: 2 }

  - id: cytation_5
    name: BioTek Cytation 5
    platform: hte
    kind: plate_reader
    adapter: http
    protocol: "1.0"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:9333
    status_path: /status
    poll_timeout_seconds: 3.0
    # The agilent-cytation-server repo conforms to STATUS_SPEC v1.0
    # (read-only). It does not yet expose `/control/*` or
    # claim/heartbeat/release. The SDK keeps the device read-only by
    # leaving `do_not_call_connect: true` in place; specific unit
    # operations (read.absorbance, read.fluorescence, read.luminescence,
    # imaging.capture, plate.load/unload, drawer.open/close) graduate
    # to /control/* in a follow-up release.
    do_not_call_connect: true
    tile: { w: 2, h: 2 }

  - id: fume_hood_actuator
    name: Fume Hood Actuator
    platform: hte
    kind: fume_hood
    adapter: legacy_http
    base_url: http://100.64.254.100:5000
    status_path: /equipment/status
    poll_timeout_seconds: 2.0
    tile: { w: 2, h: 1 }

  - id: dose_every_well
    name: Dose Every Well
    platform: hte
    kind: solid_doser
    adapter: http
    protocol: "1.1"
    base_url: http://sdl2-pi5-minicnc.tail6a1dd7.ts.net:8000
    status_path: /status
    poll_timeout_seconds: 2.0

  - id: filter_every_well
    name: Waters Filtration
    platform: hte
    kind: press
    adapter: legacy_http
    base_url: http://100.64.254.104:8000
    status_path: /status
    poll_timeout_seconds: 2.0

  - id: agilent_biostack
    name: Agilent BioStack
    platform: hte
    kind: plate_stacker
    adapter: mock

  - id: plateloc
    name: Agilent PlateLoc
    platform: hte
    kind: plate_sealer
    adapter: http
    protocol: "1.1"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8010
    status_path: /status
    poll_timeout_seconds: 2.0

  # Environmental sensor stations. Add one entry per physical sensor unit.
  # The lab map is rotated 90° clockwise from the building plan, so on screen
  # north is up and south is down. Zones (in % of map width × height):
  #   * Stairs      - top-left  quadrant (x 0..50,  y  0..25)  - greyed out
  #   * Sample Prep - top-right quadrant (x 50..100, y  0..25)
  #   * Storage     - middle horizontal band (x 0..100, y 25..50)
  #   * Lab 499     - bottom half (x 0..100, y 50..100)         - main lab
  # `location.x` and `location.y` are percentages (0-100) on that map.
  # Currently mock-only with synthesized readings until the env_sensors repo
  # is deployed; switch `adapter: mock` -> `http` + `base_url` once each
  # sensor service is up.

  - id: env_sample_prep
    name: Sample Prep Sensors
    platform: lab
    kind: environmental_sensor
    adapter: mock
    location: { x: 75, y: 12, label: "Sample Prep" }

  - id: env_storage
    name: Storage Sensors
    platform: lab
    kind: environmental_sensor
    adapter: mock
    location: { x: 50, y: 37, label: "Storage" }

  - id: env_lab499_west
    name: Lab 499 (West) Sensors
    platform: lab
    kind: environmental_sensor
    adapter: mock
    location: { x: 20, y: 75, label: "Lab 499 · West" }

  - id: env_lab499_east
    name: Lab 499 (East) Sensors
    platform: lab
    kind: environmental_sensor
    adapter: mock
    location: { x: 80, y: 75, label: "Lab 499 · East" }

  # ---------------------------------------------------------------------
  # Cameras and smart plugs hosted by `kasa-tapo-services`.
  #
  # The gateway lives at http://127.0.0.1:8002 on the dashboard host. It
  # publishes a STATUS_SPEC v1.0 surface per device:
  #   /cameras/{id}/{,/health,/status,/control/*}
  #   /plugs/{id}/{,/health,/status,/control/*}
  # The dashboard's aggregator polls the per-device /status path; the
  # ``/control/*`` POST bodies are forwarded by the API server's
  # control-passthrough route (see `api/app/control.py`).
  #
  # The HTE Tapo C245D camera is registered above under the HTE block so
  # it shows up both in the HTE PlatformCard (live preview) and on the
  # dedicated `/cameras` page. Add new cameras / plugs here.
  # ---------------------------------------------------------------------

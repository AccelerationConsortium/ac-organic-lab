# Equipment registry for the AC Organic Self-driving Lab dashboard.
#
# This file is committed. Tailscale hostnames are NOT treated as secrets - they
# require tailnet membership to be reachable. Real secrets (control tokens,
# webhook URLs, etc.) live in `.env`, gitignored.
#
# Adapter values:
#   http        -> equipment conforms to docs/STATUS_SPEC.md
#   legacy_http -> pre-migration shape; aggregator translates per-device
#   mock        -> placeholder; emits an `unknown`-status envelope
#
# Replace placeholder Tailscale magicDNS hostnames with real ones before deploying.
#
# Schema (v2): `platform:` and single `tile:` fields are replaced by:
#   tiles:  dict keyed by platform section id (see platforms.yaml).
#           Each value is { w, h } spanning the 4-col equipment grid.
#           Missing key → default { w: 2, h: 1 }.
#   pills:  shared config for the Overview platform-card pill row.
#           Currently only `open: true|false` (default false). When true,
#           the equipment row renders an "Open ↗" link to its base_url.
#   tailscale_ip:  optional, display-only. Shown in the tile subtitle after
#           "kind · id". Leave empty (or omit) to show nothing — e.g. for
#           gateway-fronted devices (cameras, plugs) whose base_url is
#           loopback. Does not affect how the aggregator reaches the device.

equipment:
  # ---------------------------------------------------------------------
  # HTE platform - displayed in the order defined in platforms.yaml.
  # The `tiles.hte` values drive tile sizes on /platforms/hte.
  # ---------------------------------------------------------------------

  # The HTE camera is the platform's hero tile. Hosted by
  # `kasa-tapo-services` (see the "Cameras and smart plugs" section below).
  - id: cam_hte_tapo_c245
    name: HTE Camera
    kind: camera
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8002
    tailscale_ip:
    status_path: /cameras/cam_hte_tapo_c245/status
    # The kasa-tapo-services gateway serves /status from a per-device cache
    # refreshed by a background poller, so dashboard polls return in ~ms
    # regardless of the underlying ONVIF SOAP cost. The 5 s budget is kept
    # as cold-start headroom for the very first request after a gateway
    # restart (cache empty, route falls back to a live build).
    poll_timeout_seconds: 5.0
    tiles:
      hte: { w: 2, h: 3 }
    pills: {}
    camera:
      host: 172.31.60.16
      onvif_port: 2020
      rtsp_port: 554
      lenses:
        # Per TP-Link's RTSP/ONVIF FAQ: dual-lens C245D exposes wide on
        # /stream1 and tele on /stream6 (non-adjacent paths). /stream2 is
        # the SD copy of the wide lens, NOT the tele lens.
        - { id: wide, label: Wide, rtsp_path: stream1, ptz_capable: false }
        - { id: tele, label: Tele, rtsp_path: stream6 }

  # HTE bench HS300 power strips (6 outlets each). Hosted by
  # kasa-tapo-services; the gateway publishes one `outlet_N` ComponentStatus
  # per outlet under `components`. The dashboard frontend currently renders
  # power strips with the generic EquipmentStatusCard - a dedicated
  # PowerStripTile (6-button grid) is a follow-up.
  - id: plug_hte_strip_right
    name: HTE Bench Power Strip (Right)
    kind: power_strip
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8002
    tailscale_ip:
    # python-kasa's per-outlet emeter sweep on a busy HS300 takes ~3-4 s
    # per cycle. The kasa-tapo-services gateway now hides that with a
    # per-device background poller + cache, so dashboard polls return in
    # ~ms. The 10 s budget is cold-start headroom for the first request
    # after a gateway restart (cache empty, route falls back to a live
    # build).
    status_path: /plugs/plug_hte_strip_right/status
    poll_timeout_seconds: 10.0
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: plug_hte_strip_left
    name: HTE Bench Power Strip (Left)
    kind: power_strip
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8002
    tailscale_ip:
    status_path: /plugs/plug_hte_strip_left/status
    poll_timeout_seconds: 10.0
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: xarm_translocation
    name: UFactory xArm5
    kind: robot_arm
    adapter: http
    protocol: "1.1"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8000
    tailscale_ip: 100.64.254.16
    status_path: /status
    poll_timeout_seconds: 2.0
    # STATUS_SPEC v1.1: claim/heartbeat/release + claim-gated control
    # (motion-graph /control/graph/* plus the legacy /move|/gripper|/track
    # surfaces, all behind require_claim). protocol "1.1" turns on the
    # dashboard passthrough's per-request claim dance, which the device's
    # hard enforcement (tokenless -> 423) requires. Claims are only
    # issuable while the controller is connected; the SDK must never
    # auto-connect a robot arm, hence do_not_call_connect stays.
    do_not_call_connect: true
    tiles:
      hte: { w: 2, h: 1 }
    # "XArm5 UI" pill / tile deep-link -> the edge-gated canonical panel URL
    # (Caddy: forward_auth @xarm_ui -> ac_auth). ABSOLUTE edge URL (port 80) so
    # it always lands on the Caddy edge, NOT the device's directly-reachable
    # :8000/web side-door and NOT the dashboard's own :8000 origin (a
    # root-relative /xarm5/web/ would resolve to :8000/xarm5/web/ when the
    # dashboard is viewed on :8000). See docs/ROADMAP.md "Control-surface exposure".
    pills:
      link_label: "UI"
      link_href: http://100.64.254.6/xarm5/web/

  - id: fume_hood_actuator
    name: Fume Hood Actuator
    kind: fume_hood
    adapter: http
    protocol: "1.1"
    base_url: http://100.64.254.100:5000
    tailscale_ip: 100.64.254.100
    status_path: /status
    poll_timeout_seconds: 2.0
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: ot2_hte
    name: Opentrons OT-2 (HTE)
    kind: liquid_handler
    adapter: http
    protocol: "1.1"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8020
    tailscale_ip: 100.64.254.16
    status_path: /status
    # The OT-2 gateway builds /status from an SSH snapshot, so it is slower than
    # other devices — but 8s is plenty and keeps one slow/dead device from
    # stalling the dashboard. The aggregator also hard-caps every fetch at
    # _MAX_FETCH_SECONDS as a backstop.
    poll_timeout_seconds: 8.0
    do_not_call_connect: true
    tiles:
      hte: { w: 2, h: 3}
    pills: {}

  - id: dose_every_well
    name: Dose Every Well
    kind: solid_doser
    adapter: http
    protocol: "1.1"
    base_url: http://sdl2-pi5-minicnc.tail6a1dd7.ts.net:8000
    tailscale_ip: 100.64.254.85
    status_path: /status
    poll_timeout_seconds: 2.0
    tiles:
      # Plate-type picker + a compact well-selection grid (small unlabelled
      # cells, only the corner wells labelled for orientation) on top of the
      # lifecycle/lid/plate/tare/dose controls. The grid is dense, so this
      # needs only modestly more height than the 2x1 default.
      hte: { w: 2, h: 2 }
    pills: {}

  - id: torry_pines_shaker
    name: Torrey Pines Shaker
    kind: shaker
    adapter: http
    protocol: "1.1"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8030
    tailscale_ip: 100.64.254.16
    status_path: /status
    # /status on the device holds a service lock across 4 serial round-trips
    # (~1.7 s on the live SC25XR). Under dashboard load that lock queues
    # callers up to ~10 s, which used to pin every /api/equipment fan-out
    # against this device's timeout (measured: 9.57 s vs 32 ms direct).
    # Capped at 2.5 s so the shaker fails fast and stops dragging the rest
    # of the fleet down -- the shaker tile will show fetch_error / unknown
    # while contended, which is the correct signal. Restore to ~10 s once
    # the device repo ships the _build_status read-off-lock fix
    # (ROADMAP shaker row).
    poll_timeout_seconds: 2.5
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: filter_every_well
    name: Waters Filtration
    kind: press
    adapter: http
    protocol: "1.1"
    base_url: http://100.64.254.104:8000
    tailscale_ip: 100.64.254.104
    status_path: /status
    poll_timeout_seconds: 2.0
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: plateloc
    name: Agilent PlateLoc
    kind: plate_sealer
    adapter: http
    protocol: "1.1"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8010
    tailscale_ip: 100.64.254.16
    status_path: /status
    poll_timeout_seconds: 2.0
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: cytation_5
    name: BioTek Cytation 5
    kind: plate_reader
    adapter: http
    protocol: "1.1"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8040
    tailscale_ip: 100.64.254.16
    status_path: /status
    poll_timeout_seconds: 3.0
    # The agilent-cytation-server repo conforms to STATUS_SPEC v1.1.
    # /control/* is wired (claim/heartbeat/release, drawer, plate
    # management, reads, imaging). The skill catalog entry lives in
    # lab_skills/skill_catalog/plate_reader.py.
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: agilent_uplc_ms
    name: Agilent UPLC-MS
    kind: hplc
    adapter: http
    protocol: "1.1"
    base_url: http://sdl2-pc-06-uplc.tail6a1dd7.ts.net:8010
    tailscale_ip: 100.64.254.19
    status_path: /status
    poll_timeout_seconds: 5.0
    # protocol: "1.1" turns on the aggregator's per-request claim dance
    # (api/app/control.py) — the agilent-hplcms-server sidecar hard-enforces
    # X-Claim-Token on /control/*. do_not_call_connect was removed: the sidecar
    # now exposes a claim-gated control surface (run.submit / run.abort /
    # queue.cancel / instrument.standby — see lab_skills/skill_catalog/hplc.py).
    # /control/startup is a read-only readiness check (it never starts OpenLab),
    # so there is no auto-connect hazard to guard against.
    tiles:
      hte: { w: 2, h: 3 }
    pills: {}

  - id: agilent_biostack
    name: Agilent BioStack
    kind: plate_stacker
    adapter: http
    protocol: "1.1"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8050
    tailscale_ip: 100.64.254.16
    status_path: /status
    poll_timeout_seconds: 2.0
    do_not_call_connect: true
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  # ---------------------------------------------------------------------
  # Echem platform - displayed in the order defined in platforms.yaml.
  # The `tiles.echem` values drive tile sizes on /platforms/echem.
  # ---------------------------------------------------------------------

  # The Echem camera is the platform's hero tile — a second Tapo C245D
  # (device alias "Tapo for MG400"), hosted by the same `kasa-tapo-services`
  # gateway as the HTE camera.
  - id: cam_echem_tapo_c245
    name: Echem Camera
    kind: camera
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8002
    tailscale_ip:
    status_path: /cameras/cam_echem_tapo_c245/status
    # Same cold-start headroom rationale as the HTE camera: the gateway
    # serves /status from a background-poller cache, so 5 s only matters
    # for the first request after a gateway restart.
    poll_timeout_seconds: 5.0
    tiles:
      echem: { w: 2, h: 3 }
    pills: {}
    camera:
      host: 172.31.60.15
      onvif_port: 2020
      rtsp_port: 554
      lenses:
        # Dual-lens C245D: wide on /stream1, tele on /stream6 (same as the
        # HTE unit; /stream2 is the SD copy of the wide lens, NOT the tele).
        - { id: wide, label: Wide, rtsp_path: stream1, ptz_capable: false }
        - { id: tele, label: Tele, rtsp_path: stream6 }

  # Second Opentrons OT-2 (robot `sdl2-ot2-complexation`, Tailscale
  # 100.64.254.91) on the Echem bench for complexation work. Fronted by the
  # second `opentrons-server` gateway instance on sdl2-pc-03 port 8021
  # (service `ot2-gateway-complexation`; deployed 2026-07-10). The gateway is
  # multi-instance by design — one process per robot, own port, own state
  # files; see the opentrons-server README "Running multiple OT-2 gateways".
  - id: ot2_complexation
    name: Opentrons OT-2 (Complexation)
    kind: liquid_handler
    adapter: http
    protocol: "1.1"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8021
    tailscale_ip: 100.64.254.91
    status_path: /status
    poll_timeout_seconds: 8.0
    do_not_call_connect: true
    tiles:
      echem: { w: 2, h: 3 }
    pills: {}

  # ---------------------------------------------------------------------
  # Web Services
  # ---------------------------------------------------------------------

  - id: pypoe_web
    name: PyPoe Web
    kind: other
    adapter: http
    protocol: "1.1"
    # base_url stays the direct :8006 origin — that's where the aggregator polls
    # /status. The browsable UI, however, is served through the single auth edge
    # at /pypoe/ (Caddy handle_path + X-Forwarded-Prefix) so it carries the
    # shared /auth banner — flat under the edge root, matching the other service
    # UIs (/xarm5, /analytica, /agente). The "Open" pill points at the ABSOLUTE
    # edge URL (http://100.64.254.6/pypoe/) rather than a root-relative path, so
    # it lands on the Caddy edge (port 80) even when the dashboard itself is being
    # viewed directly on :8000 — a root-relative link would resolve to
    # :8000/pypoe/, which the edge routes don't cover.
    base_url: http://100.64.254.6:8006
    status_path: /status
    poll_timeout_seconds: 3.0
    tiles:
      web_services: { w: 2, h: 1 }
    pills:
      link_label: "Open"
      link_href: http://100.64.254.6/pypoe/

  # Uptime Kuma — the alerting watchdog (docker, host network, :8005). It
  # doesn't speak STATUS_SPEC itself, so PyPoe gateway-fronts it (same
  # pattern as kasa-tapo-services): GET /kuma/status on pypoe_web serves a
  # v1.0 envelope with one ComponentStatus per Kuma monitor, read from
  # Kuma's public status page (slug "lab"). Kuma unreachable → "unknown"
  # per STATUS_SPEC §2.1; the tile then renders "unreachable".
  - id: uptime_kuma
    name: Uptime Kuma
    kind: other
    adapter: http
    protocol: "1.0"
    base_url: http://100.64.254.6:8006
    status_path: /kuma/status
    poll_timeout_seconds: 3.0
    tiles:
      web_services: { w: 2, h: 1 }
    pills:
      link_label: "Open"
      link_href: http://100.64.254.6:8005/

  # LaAgenteAnalitica — the agent chat UI (React/Vite) on a separate PC,
  # fronted by the edge at /agente/ (the built Vite base) so it shows the shared
  # auth banner and one sign-in. Displayed as "AnaliticaChat" on the dashboard.
  # It serves no STATUS_SPEC /status, so it's a link-out tile (adapter: mock,
  # not health-polled — shown "ready" because base_url is set); base_url is the
  # edge path the "Open ↗" pill points at.
  - id: laagente_analitica
    name: Analitica Chat
    kind: other
    adapter: mock
    base_url: http://100.64.254.6/agente/
    poll_timeout_seconds: 3.0
    tiles:
      web_services: { w: 2, h: 1 }
    pills:
      open: true

  # AnaliticaDB — the analytical-chemistry results catalog (FastAPI) on the
  # dashboard host. Serves a minimal STATUS_SPEC v1.0 /status envelope
  # (equipment_status `ready`, or `degraded` if its DB is unreachable); the
  # catalog's data API lives under /experiments, /samples, /measurements,
  # /files with Swagger at /docs. No "Open ↗" pill (it is an API, not a
  # browsable UI — its base_url root is not a page).
  - id: analytica_db
    name: Analitica Database
    kind: other
    adapter: http
    protocol: "1.0"
    base_url: http://100.64.254.6:8010
    status_path: /status
    poll_timeout_seconds: 3.0
    tiles:
      web_services: { w: 2, h: 1 }
    pills: {}

  # The dashboard's own backing services, self-reported via a minimal
  # STATUS_SPEC /status envelope each app serves. The aggregator reaches the
  # api over loopback; the auth sidecar binds the Tailnet IP (it also fronts
  # the device plane), so its base_url is the tailscale0 address — see below.
  # No "Open ↗" pill (they're not browsable UIs).
  - id: ac_organic_lab_api
    name: Dashboard API
    kind: other
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8001
    status_path: /status
    poll_timeout_seconds: 3.0
    tiles:
      web_services: { w: 2, h: 1 }
    pills: {}

  - id: ac_organic_lab_auth
    name: SDL2 Authentication
    kind: other
    adapter: http
    protocol: "1.0"
    # Tailnet-bound (the unit binds tailscale0 100.64.254.6, not loopback, so
    # the device plane can reach the roster endpoint); loopback would be refused.
    base_url: http://100.64.254.6:8009
    status_path: /status
    poll_timeout_seconds: 3.0
    tiles:
      web_services: { w: 2, h: 1 }
    pills: {}

  # Environmental sensor stations. Add one entry per physical sensor unit.
  # The lab map is rotated 90° clockwise from the building plan, so on screen
  # north is up and south is down. Zones (in % of map width × height):
  #   * Stairs      - top-left  quadrant (x 0..50,  y  0..25)  - greyed out
  #   * Sample Prep - top-right quadrant (x 50..100, y  0..25)
  #   * Storage     - middle horizontal band (x 0..100, y 25..50)
  #   * Lab 499     - bottom half (x 0..100, y 50..100)         - main lab
  # `location.x` and `location.y` are percentages (0-100) on that map.
  # Currently mock-only with synthesized readings until the env_sensors repo
  # is deployed; switch `adapter: mock` -> `http` + `base_url` once each
  # sensor service is up.

  - id: env_sample_prep
    name: Sample Prep Sensors
    kind: environmental_sensor
    adapter: mock
    tiles: {}
    pills: {}
    location: { x: 75, y: 12, label: "Sample Prep" }

  - id: env_storage
    name: Storage Sensors
    kind: environmental_sensor
    adapter: mock
    tiles: {}
    pills: {}
    location: { x: 50, y: 37, label: "Storage" }

  - id: env_lab499_west
    name: Lab 499 (West) Sensors
    kind: environmental_sensor
    adapter: mock
    tiles: {}
    pills: {}
    location: { x: 20, y: 75, label: "Lab 499 · West" }

  - id: env_lab499_east
    name: Lab 499 (East) Sensors
    kind: environmental_sensor
    adapter: mock
    tiles: {}
    pills: {}
    location: { x: 80, y: 75, label: "Lab 499 · East" }

  # ---------------------------------------------------------------------
  # Cameras and smart plugs hosted by `kasa-tapo-services`.
  #
  # The gateway lives at http://127.0.0.1:8002 on the dashboard host. It
  # publishes a STATUS_SPEC v1.0 surface per device:
  #   /cameras/{id}/{,/health,/status,/control/*}
  #   /plugs/{id}/{,/health,/status,/control/*}
  # The dashboard's aggregator polls the per-device /status path; the
  # ``/control/*`` POST bodies are forwarded by the API server's
  # control-passthrough route (see `api/app/control.py`).
  #
  # The HTE Tapo C245D camera is registered above under the HTE block so
  # it shows up both in the HTE PlatformCard (live preview) and on the
  # dedicated `/cameras` page. Add new cameras / plugs here.
  # ---------------------------------------------------------------------

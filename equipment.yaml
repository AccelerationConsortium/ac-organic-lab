  # ---------------------------------------------------------------------
  # Cameras and smart plugs hosted by `kasa-tapo-services`.
  #
  # The gateway lives at http://127.0.0.1:8002 on the dashboard host. It
  # publishes a STATUS_SPEC v1.0 surface per device:
  #   /cameras/{id}/{,/health,/status,/control/*}
  #   /plugs/{id}/{,/health,/status,/control/*}
  # The dashboard's aggregator polls the per-device /status path; the
  # ``/control/*`` POST bodies are forwarded by the API server's
  # control-passthrough route (see `api/app/control.py`).
  #
  # The HTE Tapo C245D camera is registered above under the HTE block so
  # it shows up both in the HTE PlatformCard (live preview) and on the
  # dedicated `/cameras` page. Add new cameras / plugs here.
  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # Sample-prep bench ("Gibbie"), monitored read-only by `sdl2-gibbie-server`
  # on the Gibbie PC (sdl2-pc-04). One STATUS_SPEC v1.2 envelope per device at
  # /devices/{id}/status; no /control/* anywhere (§9 read-only clause). The
  # bench is driven by `sdl2_sampleprep_platform` (UR arm over RTDE, Flex over
  # its SSH REPL, XPR balance over SOAP), which this service never touches.
  # `gateway_fronted: true` so a device the monitor cannot reach (reported as
  # `unknown`, §2.1) counts as unreachable for uptime and PyPoe alerts.
  # Network (resolved 2026-09-06): everything Gibbie is on the lab switch
  # 192.168.254.x — the PC at .79 (second onboard NIC, wired), the Flex .81,
  # the UR-3e .89, the XPR balance .83 — matching the workflow's own .env
  # (ROBOT_IP / BALANCE_IP). The monitor's config had shipped with
  # 192.168.1.100 / 192.168.1.1 from an older bench layout; fixed on the PC
  # the same day and the arm reads `ready`. The balance tile stays `unknown`
  # until the XPR's web service (port 8002, what the workflow uses) is
  # switched on at the instrument — nothing network-side is missing.
  # Neighbours on the same switch that are NOT Gibbie: the Process Chemistry
  # platform's UR5-CB3 (.16) and MT balance (.13), a third UR at .49, and a
  # separate 192.168.1.x segment behind the Cytation PC's USB adapter (a UR at
  # 192.168.1.237) — see ROADMAP.
  # ---------------------------------------------------------------------

  - id: gibbie_workflow
    name: Gibbie Workflow
    kind: other
    adapter: http
    protocol: "1.2"
    gateway_fronted: true
    # Reflects the Gibbie UI bridge (127.0.0.1:8000 on that PC): run in
    # progress -> busy/running with the live stage; a simulated run -> dry_run.
    base_url: http://sdl2-pc-04.tail6a1dd7.ts.net:8070
    tailscale_ip: 100.64.254.17
    status_path: /devices/gibbie_workflow/status
    poll_timeout_seconds: 5.0

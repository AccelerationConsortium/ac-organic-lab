# Equipment registry for the AC Organic Self-driving Lab dashboard.
#
# This file is committed. Tailscale hostnames are NOT treated as secrets - they
# require tailnet membership to be reachable. Real secrets (control tokens,
# webhook URLs, etc.) live in `.env`, gitignored.
#
# Adapter values:
#   http        -> equipment conforms to docs/STATUS_SPEC.md
#   legacy_http -> pre-migration shape; aggregator translates per-device
#   mock        -> placeholder; emits an `unknown`-status envelope
#
# Replace placeholder Tailscale magicDNS hostnames with real ones before deploying.
#
# Schema (v2): `platform:` and single `tile:` fields are replaced by:
#   tiles:  dict keyed by platform section id (see platforms.yaml).
#           Each value is { w, h } spanning the 4-col equipment grid.
#           Missing key → default { w: 2, h: 1 }.
#   pills:  shared config for the Overview platform-card pill row.
#           Currently only `open: true|false` (default false). When true,
#           the equipment row renders an "Open ↗" link to its base_url.
#   tailscale_ip:  optional, display-only. Shown in the tile subtitle after
#           "kind · id". Leave empty (or omit) to show nothing — e.g. for
#           gateway-fronted devices (cameras, plugs) whose base_url is
#           loopback. Does not affect how the aggregator reaches the device.

equipment:
  # ---------------------------------------------------------------------
  # HTE platform - displayed in the order defined in platforms.yaml.
  # The `tiles.hte` values drive tile sizes on /platforms/hte.
  # ---------------------------------------------------------------------

  # The HTE camera is the platform's hero tile. Hosted by
  # `kasa-tapo-services` (see the "Cameras and smart plugs" section below).
  - id: cam_hte_tapo_c245
    name: HTE Camera
    kind: camera
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8002
    tailscale_ip:
    status_path: /cameras/cam_hte_tapo_c245/status
    # The kasa-tapo-services gateway serves /status from a per-device cache
    # refreshed by a background poller, so dashboard polls return in ~ms
    # regardless of the underlying ONVIF SOAP cost. The 5 s budget is kept
    # as cold-start headroom for the very first request after a gateway
    # restart (cache empty, route falls back to a live build).
    poll_timeout_seconds: 5.0
    tiles:
      hte: { w: 2, h: 3 }
    pills: {}
    camera:
      host: 172.31.60.16
      onvif_port: 2020
      rtsp_port: 554
      lenses:
        # Per TP-Link's RTSP/ONVIF FAQ: dual-lens C245D exposes wide on
        # /stream1 and tele on /stream6 (non-adjacent paths). /stream2 is
        # the SD copy of the wide lens, NOT the tele lens.
        - { id: wide, label: Wide, rtsp_path: stream1, ptz_capable: false }
        - { id: tele, label: Tele, rtsp_path: stream6 }

  # HTE bench HS300 power strips (6 outlets each). Hosted by
  # kasa-tapo-services; the gateway publishes one `outlet_N` ComponentStatus
  # per outlet under `components`. The dashboard frontend currently renders
  # power strips with the generic EquipmentStatusCard - a dedicated
  # PowerStripTile (6-button grid) is a follow-up.
  - id: plug_hte_strip_right
    name: HTE Bench Power Strip (Right)
    kind: power_strip
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8002
    tailscale_ip:
    # python-kasa's per-outlet emeter sweep on a busy HS300 takes ~3-4 s
    # per cycle. The kasa-tapo-services gateway now hides that with a
    # per-device background poller + cache, so dashboard polls return in
    # ~ms. The 10 s budget is cold-start headroom for the first request
    # after a gateway restart (cache empty, route falls back to a live
    # build).
    status_path: /plugs/plug_hte_strip_right/status
    poll_timeout_seconds: 10.0
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: plug_hte_strip_left
    name: HTE Bench Power Strip (Left)
    kind: power_strip
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8002
    tailscale_ip:
    status_path: /plugs/plug_hte_strip_left/status
    poll_timeout_seconds: 10.0
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: xarm_translocation
    name: UFactory xArm5
    kind: robot_arm
    adapter: http
    protocol: "1.2"
    edge_secret_env: XARM_EDGE_SHARED_SECRET
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8000
    tailscale_ip: 100.64.254.16
    status_path: /status
    # 8 s: this PC is reached over Wi-Fi (no wired path to gaia), with RTT
    # spikes to ~1.7 s. 2 s timed out half the polls (2026-08-16); 8 s is the
    # aggregator hard cap (_MAX_FETCH_SECONDS), same as ot2_hte on this host.
    poll_timeout_seconds: 8.0
    # STATUS_SPEC v1.2 (device repo commit c91dd05, verified live 2026-07-30):
    # activity / activity_since are observed from the controller's motion
    # state (not derived from equipment_status), and allowed_actions is gated
    # on activity — while activity is "running" every move.<node_id> target
    # is withheld and only "stop" remains. Only one motion may be in flight;
    # a concurrent move is refused with HTTP 409 {"detail":{"error":
    # "motion_in_progress", ...}} (§6.1 state conflict, not a 412
    # precondition). The dashboard passthrough's per-request claim dance
    # stays (the device hard-enforces X-Claim-Token; tokenless -> 423).
    # Claims are only issuable while the controller is connected; the SDK
    # must never auto-connect a robot arm, hence do_not_call_connect stays.
    do_not_call_connect: true
    tiles:
      hte: { w: 2, h: 1 }
    # "Open" pill / tile deep-link -> the edge-gated canonical panel URL
    # (Caddy: forward_auth @xarm_ui -> ac_auth). ROOT-RELATIVE, so it resolves
    # against whichever edge origin the operator is already on and keeps them
    # on one origin with one session. This was an absolute
    # http://100.64.254.6/... URL until 2026-08-26; that pinned every visitor
    # to the plain-HTTP origin, so anyone on the HTTPS tailnet origin (added
    # the same day for secure-context features -- microphone, clipboard) got
    # bounced back to insecure HTTP and a second sign-in. Root-relative is
    # also what PillConfig documents as the intended form
    # (skills/src/lab_skills/registry.py); the old comment here contradicted it.
    # Either way this never points at the device's directly-reachable
    # :8000/web side-door -- the edge is the audited path.
    #
    # CAVEAT (the reason the absolute form existed): viewing the dashboard
    # directly on :8000, bypassing Caddy, resolves this to :8000/xarm5/web/,
    # which Next.js does not serve. That is accepted -- :8000-direct is
    # off-canon by design ("users MUST reach the lab as http://100.64.254.6/",
    # deploy/Caddyfile.single-edge) and already costs a separate session.
    # See docs/ROADMAP.md "Control-surface exposure".
    pills:
      link_label: "Open"
      link_href: /xarm5/web/

  - id: fume_hood_actuator
    name: Fume Hood Actuator
    kind: fume_hood
    adapter: http
    protocol: "1.1"
    base_url: http://100.64.254.100:5000
    tailscale_ip: 100.64.254.100
    status_path: /status
    poll_timeout_seconds: 2.0
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: ot2_hte
    name: Opentrons OT-2 (HTE)
    kind: liquid_handler
    # The gateway process answers /status even when the robot behind it is
    # gone; it then reports `unknown` (STATUS_SPEC §2.1). This flag makes the
    # dashboard treat that as unreachable for uptime and PyPoe alerts.
    gateway_fronted: true
    adapter: http
    protocol: "1.2"
    edge_secret_env: OT2_EDGE_SECRET
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8020
    tailscale_ip: 100.64.254.16
    status_path: /status
    # Robot transport (changed 2026-09-04): the OT-2 (HTE) robot
    # (`ot2cytation`, board rev A)is reachable over **instrument-LAN Ethernet** at
    # **192.168.254.50:31950** — the gateway on sdl2-pc-03 reaches it directly
    # over that wired path (OT2_HTTP_BASE_URL=http://192.168.254.50:31950), NOT
    # via Tailscale. The old tailnet node `100.64.254.90` (`sdl2-ot2-hte`)
    # is offline/legacy (the robot no longer runs Tailscale); if the robot ever
    # drops off the LAN, NO fallback exists — the dashboard tile shows the robot's
    # own reachability flag (`details.robot.reachable`), which the gateway reports
    # truthfully even when it answers HTTP 200 itself.
    # The OT-2 gateway builds /status from an SSH snapshot, so it is slower than
    # other devices — but 8s is plenty and keeps one slow/dead device from
    # stalling the dashboard. The aggregator also hard-caps every fetch at
    # _MAX_FETCH_SECONDS as a backstop.
    poll_timeout_seconds: 8.0
    do_not_call_connect: true
    tiles:
      hte: { w: 2, h: 3}
    # "Open" pill -> the edge-gated OT-2 gateway operator SPA at
    # /ot2/hte/ui/ (Caddy: forward_auth @ot2_hte -> ac_auth, header_up
    # X-Edge-Key). ROOT-RELATIVE so it follows the operator's current edge
    # origin (HTTP-IP or HTTPS-tailnet) instead of pinning them to plain HTTP
    # — see the xarm_translocation entry above for the full rationale and the
    # :8000-direct caveat. Never the device's directly-reachable :8020/ui
    # side-door (which 404s without X-Edge-Key anyway). base_url stays the
    # direct device port — the aggregator polls /status there, unaffected.
    pills:
      link_label: "Open"
      link_href: /ot2/hte/ui/
  - id: dose_every_well
    name: Dose Every Well
    kind: solid_doser
    adapter: http
    protocol: "1.1"
    base_url: http://sdl2-pi5-minicnc.tail6a1dd7.ts.net:8000
    tailscale_ip: 100.64.254.85
    status_path: /status
    poll_timeout_seconds: 2.0
    tiles:
      # Plate-type picker + a compact well-selection grid (small unlabelled
      # cells, only the corner wells labelled for orientation) on top of the
      # lifecycle/lid/plate/tare/dose controls. The grid is dense, so this
      # needs only modestly more height than the 2x1 default.
      hte: { w: 2, h: 2 }
    pills: {}

  - id: torry_pines_shaker
    name: Torrey Pines Shaker
    kind: shaker
    adapter: http
    # v1.2 native since 2026-07-25 (torry-pines-shaker-server 0.2.0):
    # activity/activity_since observed from the motor, cycles_total,
    # per-subsystem allowed_actions gating. First v1.2 device in the fleet.
    protocol: "1.2"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8030
    tailscale_ip: 100.64.254.16
    status_path: /status
    # Was capped at 2.5 s while /status held the device's service lock
    # across 4 serial round-trips (~1.7 s each poll; measured 9.57 s under
    # contention). The read-off-lock + short-TTL readings cache fix shipped
    # with the 0.2.0 deploy (2026-07-25), so the cap is restored to a
    # comfortable timeout.
    poll_timeout_seconds: 10.0
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: filter_every_well
    name: Waters Filtration
    kind: press
    adapter: http
    # v1.2 native since 2026-08-09 (filter-every-well 1.1.0): move-lock
    # activity, cycles_total counting platen strokes (a stroke is seconds —
    # invisible to the 60 s poll, so the counter is the utilization record).
    protocol: "1.2"
    base_url: http://100.64.254.104:8000
    tailscale_ip: 100.64.254.104
    status_path: /status
    poll_timeout_seconds: 2.0
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: plateloc
    name: Agilent PlateLoc
    kind: plate_sealer
    adapter: http
    # v1.2 native, live since 2026-07-26 (agilent-plateloc-server 1.4.0):
    # seal-cycle activity, cycles_total mirroring the instrument's lifetime
    # odometer (a seal cycle is seconds — invisible to the 60 s poll, so
    # utilization for this device comes from cycles_total deltas, §2.3.1).
    protocol: "1.2"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8010
    tailscale_ip: 100.64.254.16
    status_path: /status
    # 8 s: Wi-Fi path to this PC (see xarm_translocation note). Was 2 s.
    poll_timeout_seconds: 8.0
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: cytation_5
    name: BioTek Cytation 5
    kind: plate_reader
    adapter: http
    protocol: "1.2"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8040
    tailscale_ip: 100.64.254.16
    status_path: /status
    # 8 s: Wi-Fi path to this PC (see xarm_translocation note). Was 3 s.
    poll_timeout_seconds: 8.0
    # The agilent-cytation-server repo conforms to STATUS_SPEC v1.2.
    # /control/* is wired (claim/heartbeat/release, drawer, plate
    # management, three reads, imaging, incubator, shaker). Catalog:
    # lab_skills/skill_catalog/plate_reader.py (15 SkillDefs, ranges
    # match the live OpenAPI).
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  - id: agilent_uplc_ms
    name: Agilent UPLC-MS
    kind: hplc
    adapter: http
    # v1.2 native since 2026-08-09 (agilent-hplcms-server 0.3.0): acquisition
    # activity observed from the OLSS/sirslt signals, so an error landing
    # mid-run reports error + activity "running" instead of erasing the run.
    # No cycles_total by design — runs are minutes-to-hours, so the 60 s
    # sampled series already sees every one (§2.3.1 recommends the counter
    # only for sub-poll-interval operations).
    protocol: "1.2"
    base_url: http://sdl2-pc-06-uplc.tail6a1dd7.ts.net:8010
    tailscale_ip: 100.64.254.19
    status_path: /status
    # 8 s: Wi-Fi path to this PC (see xarm_translocation note). Was 5 s.
    poll_timeout_seconds: 8.0
    # protocol >= "1.1" turns on the aggregator's per-request claim dance
    # (api/app/control.py) — the agilent-hplcms-server sidecar hard-enforces
    # X-Claim-Token on /control/*. do_not_call_connect was removed: the sidecar
    # now exposes a claim-gated control surface (run.submit / run.abort /
    # queue.cancel / instrument.standby — see lab_skills/skill_catalog/hplc.py).
    # /control/startup is a read-only readiness check (it never starts OpenLab),
    # so there is no auto-connect hazard to guard against.
    tiles:
      hte: { w: 2, h: 3 }
    pills: {}

  - id: agilent_biostack
    name: Agilent BioStack
    kind: plate_stacker
    adapter: http
    protocol: "1.2"
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8050
    tailscale_ip: 100.64.254.16
    status_path: /status
    # 8 s: Wi-Fi path to this PC (see xarm_translocation note). Was 2 s.
    poll_timeout_seconds: 8.0
    do_not_call_connect: true
    tiles:
      hte: { w: 2, h: 1 }
    pills: {}

  # ---------------------------------------------------------------------
  # Echem platform - displayed in the order defined in platforms.yaml.
  # The `tiles.complexation` values drive tile sizes on /platforms/complexation.
  # ---------------------------------------------------------------------

  # Second Tapo C245D (device alias "Tapo for MG400"), hosted by the same
  # `kasa-tapo-services` gateway as the HTE camera. Registered + polled, but
  # since 2026-08-23 NOT listed in platforms.yaml — it is hidden from the
  # Complexation platform (Overview card, Platforms tab, /platforms/
  # complexation). Add it back to that section's equipment list to show it.
  - id: cam_echem_tapo_c245
    name: Echem Platform Camera
    kind: camera
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8002
    tailscale_ip:
    status_path: /cameras/cam_echem_tapo_c245/status
    # Same cold-start headroom rationale as the HTE camera: the gateway
    # serves /status from a background-poller cache, so 5 s only matters
    # for the first request after a gateway restart.
    poll_timeout_seconds: 5.0
    tiles:
      complexation: { w: 2, h: 3 }
    pills: {}
    camera:
      host: 172.31.60.15
      onvif_port: 2020
      rtsp_port: 554
      lenses:
        # Dual-lens C245D: wide on /stream1, tele on /stream6 (same as the
        # HTE unit; /stream2 is the SD copy of the wide lens, NOT the tele).
        - { id: wide, label: Wide, rtsp_path: stream1, ptz_capable: false }
        - { id: tele, label: Tele, rtsp_path: stream6 }

  # Echem camera: a single-lens Tapo C100 watching the OT-2. With
  # cam_echem_tapo_c245 hidden it is the only camera the complexation
  # section lists, so it is the one the Overview card streams (and the
  # camera tile on /platforms/complexation).
  - id: cam_echem_tapo_c100
    name: Echem OT2 Camera
    kind: camera
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8002
    tailscale_ip:
    status_path: /cameras/cam_echem_tapo_c100/status
    # Same cold-start headroom rationale as the other cameras: the gateway
    # serves /status from a background-poller cache, so 5 s only matters
    # for the first request after a gateway restart.
    poll_timeout_seconds: 5.0
    tiles:
      complexation: { w: 2, h: 3 }
    pills: {}
    camera:
      host: 172.31.60.22
      onvif_port: 2020
      rtsp_port: 554
      lenses:
        # Single-lens C100: /stream1 (HD) only; /stream2 is the SD copy.
        # Fixed lens — no PTZ.
        - { id: main, label: Main, rtsp_path: stream1, ptz_capable: false }

  # Second Opentrons OT-2 (robot `sdl2-ot2-complexation`, Tailscale
  # 100.64.254.91) on the Echem bench for complexation work. Fronted by the
  # second `opentrons-server` gateway instance on sdl2-pc-03 port 8021
  # (service `ot2-gateway-complexation`; deployed 2026-07-10). The gateway is
  # multi-instance by design — one process per robot, own port, own state
  # files; see the opentrons-server README "Running multiple OT-2 gateways".
  - id: ot2_complexation
    name: Opentrons OT-2 (Complexation)
    kind: liquid_handler
    # The gateway process answers /status even when the robot behind it is
    # gone; it then reports `unknown` (STATUS_SPEC §2.1). This flag makes the
    # dashboard treat that as unreachable for uptime and PyPoe alerts.
    gateway_fronted: true
    adapter: http
    protocol: "1.2"
    edge_secret_env: OT2_EDGE_SECRET
    base_url: http://sdl2-pc-03-cytation.tail6a1dd7.ts.net:8021
    tailscale_ip: 100.64.254.91
    status_path: /status
    poll_timeout_seconds: 8.0
    do_not_call_connect: true
    # Robot transport (standing since 2026-09-05, confirmed 2026-09-06): the
    # OT-2 (Complexation) robot (`ot2training`, serial `weathered-dream`, board
    # rev 2.1) is reached over its **USB link** — the gateway on sdl2-pc-03
    # points at the UPLC PC's portproxy, OT2_HTTP_BASE_URL=
    # http://100.64.254.19:31951 -> 169.254.40.81:31950 (the robot's USB-B
    # cable into sdl2-pc-06-uplc). This stays the path until a USB-to-Ethernet
    # adapter puts the robot on the lab switch (ROADMAP → ot2_hte sub-tasks);
    # then repoint the gateway with tools/ot2-set-robot-url.ps1 and retire the
    # bridge. Do NOT repoint to the robot's own Tailscale/Wi-Fi address
    # (`sdl2-ot2-complexation`, 100.64.254.91): the Pi 3B+ radio wedges on its
    # own (2026-08-30, 2026-09-04) and only a hard reboot restores it. If the
    # bridge port stops answering, `Restart-Service iphlpsvc` on the UPLC PC
    # before blaming the robot. Identity rule (robot_serial + board_revision +
    # api/fw) still applies: 172.31.60.10 (`ot2cytation`, board rev A) is a
    # DIFFERENT OT-2.
    tiles:
      complexation: { w: 2, h: 3 }
    # "Open" pill -> the edge-gated OT-2 gateway operator SPA at
    # /ot2/complexation/ui/ (Caddy: forward_auth @ot2_complexation -> ac_auth,
    # header_up X-Edge-Key). ROOT-RELATIVE so it follows the operator's current
    # edge origin (HTTP-IP or HTTPS-tailnet) instead of pinning them to plain
    # HTTP — see the xarm_translocation entry above for the full rationale and
    # the :8000-direct caveat. Never the device's directly-reachable :8021/ui
    # side-door (which 404s without X-Edge-Key anyway). base_url stays the
    # direct device port — the aggregator polls /status there, unaffected.
    pills:
      link_label: "Open"
      link_href: /ot2/complexation/ui/

  # ---------------------------------------------------------------------
  # Web Services
  # ---------------------------------------------------------------------

  # Monitoring-only Bambu Lab gateway on the dashboard host. The service
  # status summarizes local MQTT connectivity for its configured printers;
  # the internal pill opens the read-only printer telemetry page under Utils.
  - id: bambu_gateway
    name: Bambu Printers
    kind: other
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8012
    status_path: /status
    poll_timeout_seconds: 3.0
    do_not_call_connect: true
    tiles:
      web_services: { w: 2, h: 1 }
    pills:
      link_label: "GO"
      link_href: /utils/devices
      internal: true

  # Per-printer STATUS_SPEC surfaces served from the same gateway. They are
  # intentionally omitted from Overview sections and rendered together on
  # /utils/devices instead. The per-printer envelopes are v1.2 (print-job
  # `activity` observed from the printer's gcode state); the aggregate gateway
  # `/status` above stays v1.0 — it fronts printers and has no primary
  # operation of its own.
  - id: bambu_p1s_01
    name: Bambu P1S 01
    kind: other
    adapter: http
    protocol: "1.2"
    base_url: http://127.0.0.1:8012
    status_path: /printers/bambu_p1s_01/status
    poll_timeout_seconds: 3.0
    do_not_call_connect: true
    tiles: {}
    pills: {}

  - id: bambu_h2d_01
    name: Bambu H2D 01
    kind: other
    adapter: http
    protocol: "1.2"
    base_url: http://127.0.0.1:8012
    status_path: /printers/bambu_h2d_01/status
    poll_timeout_seconds: 3.0
    do_not_call_connect: true
    tiles: {}
    pills: {}

  - id: pypoe_web
    name: PyPoe Web
    kind: other
    adapter: http
    protocol: "1.1"
    # base_url stays the direct :8006 origin — that's where the aggregator polls
    # /status. The browsable UI, however, is served through the single auth edge
    # at /pypoe/ (Caddy handle_path + X-Forwarded-Prefix) so it carries the
    # shared /auth banner — flat under the edge root, matching the other service
    # UIs (/xarm5, /analytica, /agente). The "Open" pill is ROOT-RELATIVE so it
    # follows the operator's current edge origin (HTTP-IP or HTTPS-tailnet)
    # instead of pinning them to plain HTTP — see xarm_translocation above for
    # the full rationale and the :8000-direct caveat.
    base_url: http://100.64.254.6:8006
    status_path: /status
    poll_timeout_seconds: 3.0
    tiles:
      web_services: { w: 2, h: 1 }
    pills:
      link_label: "Open"
      link_href: /pypoe/

  # kasa-tapo-services — the camera + plug gateway process itself (loopback
  # :8002 on this host, reverse-proxied by Caddy for streams/controls). The
  # per-camera and per-plug entries above poll its per-device envelopes;
  # this row is the service-level GET /status (added for the Overview
  # Services card) answering "is the gateway process up at all".
  - id: kasa_tapo_gateway
    name: Camera & Plug Gateway
    kind: other
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8002
    status_path: /status
    poll_timeout_seconds: 2.0
    tiles:
      web_services: { w: 2, h: 1 }
    pills: {}

  # Uptime Kuma — the alerting watchdog (docker, host network, :8005). It
  # doesn't speak STATUS_SPEC itself, so PyPoe gateway-fronts it (same
  # pattern as kasa-tapo-services): GET /kuma/status on pypoe_web serves a
  # v1.0 envelope with one ComponentStatus per Kuma monitor, read from
  # Kuma's public status page (slug "lab"). Kuma unreachable → "unknown"
  # per STATUS_SPEC §2.1; the tile then renders "unreachable".
  - id: uptime_kuma
    name: Uptime Kuma
    kind: other
    adapter: http
    protocol: "1.0"
    base_url: http://100.64.254.6:8006
    status_path: /kuma/status
    poll_timeout_seconds: 3.0
    tiles:
      web_services: { w: 2, h: 1 }
    pills:
      link_label: "Open"
      # Stays ABSOLUTE, unlike every other pill: Kuma is its own Caddy site
      # block on :8005, not a path under the main edge, so there is no
      # root-relative form. An HTTPS visitor therefore leaves the secure
      # origin here (and signs in again). Fix properly by giving Kuma a path
      # on the main edge, not by editing this line.
      link_href: http://100.64.254.6:8005/
      admin_only: true
      # Kuma's admin UI has its own login and sits outside the SSO edge
      # (Kuma can't be served under a sub-path) — only show the link to
      # accounts holding a role on this equipment (admin, per roster).
      authorized_only: true

  # Hermes Agent — the Hermes web dashboard on this host (loopback :9119),
  # fronted by the single auth edge at /hermes/ (Caddyfile.single-edge:
  # forward_auth + handle_path). It serves no STATUS_SPEC /status, so like
  # Analitica Chat this is a link-out tile (adapter: mock, not health-polled).
  # The Open link is admin_only (a flat operator's implicit global grant
  # would pass authorized_only, so the stricter flag is what actually keeps
  # it admin-only); the edge's forward_auth + admin 403 remain the real gate
  # — hiding the pill is UX, not security.
  - id: hermes_web
    name: Hermes Agent
    kind: other
    adapter: mock
    base_url: http://100.64.254.6/hermes/
    poll_timeout_seconds: 3.0
    tiles:
      web_services: { w: 2, h: 1 }
    pills:
      link_label: "Open"
      link_href: /hermes/
      authorized_only: true
      admin_only: true

  # LaAgenteAnalitica — the agent chat UI (React/Vite) on a separate PC,
  # fronted by the edge at /agente/ (the built Vite base) so it shows the shared
  # auth banner and one sign-in. Displayed as "AnaliticaChat" on the dashboard.
  # It serves no STATUS_SPEC /status, so it's a link-out tile (adapter: mock,
  # not health-polled — shown "ready" because base_url is set).
  - id: laagente_analitica
    name: Analitica Chat
    kind: other
    adapter: mock
    base_url: http://100.64.254.6/agente/
    poll_timeout_seconds: 3.0
    tiles:
      web_services: { w: 2, h: 1 }
    # link_href, not `open: true`: `open` links to base_url, which must stay
    # absolute, and an absolute HTTP URL pins HTTPS visitors back to the
    # insecure origin. PillConfig documents link_href as the preferred form
    # whenever the target is an edge path rather than a raw device port.
    # Renders identically ("Open ↗").
    pills:
      link_label: "Open"
      link_href: /agente/

  # Bitácora — the agentic ELN (Next.js standalone :3001 + FastAPI :8050),
  # fronted by the edge at /bitacora/ so it shares the auth banner and one
  # sign-in. Also embedded in the dashboard's own Workflows tab; this entry is
  # the Web Services tile + the grantable equipment id.
  #
  # Live-polled since 2026-08-06: the API serves a real STATUS_SPEC v1.0
  # envelope, so this is `adapter: http`, not a link-out tile. base_url is the
  # API's LOOPBACK port, not the edge path: bitácora binds 127.0.0.1 by design
  # (the edge is the only path in, because it is what injects the verified
  # X-Auth-User the ELN attributes records to), and the edge route itself is
  # forward_auth'd — a poll through /bitacora/ would be answered by the auth
  # sidecar, not the ELN. The dashboard API runs on this same host, so loopback
  # is reachable; this entry is not portable to an aggregator elsewhere.
  #
  # `degraded` here means DB-only mode (no GitHub App): registry, rooms and
  # chat work, protocol repos cannot be stamped.
  - id: bitacora_eln
    name: Bitacora ELN
    kind: other
    adapter: http
    protocol: "1.0"
    base_url: http://127.0.0.1:8050
    status_path: /status
    poll_timeout_seconds: 3.0
    tiles:
      web_services: { w: 2, h: 1 }
    # No `open: true` — base_url is now loopback and useless to a browser. The
    # pill is ROOT-RELATIVE so it follows the operator's current edge origin
    # (HTTP-IP or HTTPS-tailnet) — see xarm_translocation above for the full
    # rationale and the :8000-direct caveat.
    pills:
      link_label: "Open"
      link_href: /bitacora/


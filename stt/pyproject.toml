[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdl-lab-stt"
version = "0.1.0"
description = "Loopback speech-to-text service for the lab assistant (Qwen3-ASR on the local GPU; no audio leaves the tailnet)."
# Own venv on 3.12: the workspace root runs 3.14, which the GPU stack does not
# support yet — and a GPU model must never load inside the api/ process anyway.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "transformers>=5.13.0",
    "torch>=2.7",
    "accelerate>=1.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "kokoro>=0.9",
    "numpy>=1.26",
]

[project.scripts]
lab-stt-serve = "lab_stt.service:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
